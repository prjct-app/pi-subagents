name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The shared TUI kit is a sibling repository, never an npm package.
      - run: git clone --depth 1 https://github.com/prjct-app/pi-tui-kit ../pi-tui-kit && npm ci --prefix ../pi-tui-kit --ignore-scripts && npm run build --prefix ../pi-tui-kit
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:package
